<!doctype html>
<html lang="es">

<head>
    <title>{{ producto.nombre }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="container mt-4">

    <div class="card p-3">

        <div class="row g-0">

            <!-- GALERÍA DE IMÁGENES -->
            <div class="col-md-4">
                <div id="galeria" class="carousel slide" data-bs-ride="carousel">

                    <div class="carousel-inner">

                        {% if producto.imagen_1 %}
                        <div class="carousel-item active">
                            <img src="{{ producto.imagen_1.url }}" class="d-block w-100" alt="Imagen 1">
                        </div>
                        {% endif %}

                        {% if producto.imagen_2 %}
                        <div class="carousel-item">
                            <img src="{{ producto.imagen_2.url }}" class="d-block w-100" alt="Imagen 2">
                        </div>
                        {% endif %}

                        {% if producto.imagen_3 %}
                        <div class="carousel-item">
                            <img src="{{ producto.imagen_3.url }}" class="d-block w-100" alt="Imagen 3">
                        </div>
                        {% endif %}
                    </div>

                    <!-- Controles -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#galeria" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#galeria" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>

                </div>
            </div>

            <!-- INFORMACIÓN DEL PRODUCTO -->
            <div class="col-md-8">
                <div class="card-body">
                    <h2 class="card-title">{{ producto.nombre }}</h2>
                    <p class="card-text">{{ producto.descripcion }}</p>
                    <h3 class="text-success">$ {{ producto.precio_base }}</h3>
                    <a href="#" class="btn btn-success">Solicitar este producto</a>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
