{% extends "base.html" %}
{% block content %}

<h1 class="mb-4">Pedido Personalizado</h1>

<form method="post" enctype="multipart/form-data" class="card p-4">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Nombre del cliente</label>
        <input type="text" name="cliente_nombre" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email (opcional)</label>
        <input type="email" name="cliente_email" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono (opcional)</label>
        <input type="text" name="cliente_telefono" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Red social (opcional)</label>
        <input type="text" name="cliente_red_social" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción del pedido</label>
        <textarea name="descripcion" class="form-control" rows="4" required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Imágenes de referencia (puedes subir varias)</label>
        <input type="file" name="imagenes" class="form-control" multiple>
    </div>

    <div class="mb-3">
        <label class="form-label">Fecha requerida (opcional)</label>
        <input type="date" name="fecha_solicitada" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Enviar pedido</button>
</form>

<a href="/" class="btn btn-secondary mt-3">Volver al inicio</a>

{% endblock %}
